# golangci-lint v2, strict (RULES.md D11, R-LINT-2). Every linter is on
# but those listed under `disable`, each with its reason. A finding is an
# error: there is no baseline, and `max-issues-per-linter` and
# `max-same-issues` are 0, so none is hidden.
version: "2"

run:
  go: "1.26"
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: all
  disable:
    # Go names a short-lived variable with a short name; length is no measure.
    - varnamelen
    # Demands every field in every composite literal, which Go's zero values make needless.
    - exhaustruct
    - exhaustruct_v5
    # Deprecated, replaced by gomodguard_v2, which `all` enables.
    - gomodguard
    # Blank lines are gofmt's matter, not a linter's.
    - wsl
    - wsl_v5
    - nlreturn
    # The codec's unexported functions are tested from inside the package (R-TEST-1, RULES.md D13).
    - testpackage
    # `if err := f(); err != nil` is the Go idiom for an error used once.
    - noinlineerr

  settings:
    # R-DEP-1, D10: no module but the standard library and this one.
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/turborel/turborel-go
          # R-GO-1: no unsafe code.
          deny:
            - pkg: unsafe
              desc: "R-GO-1: no unsafe code"
    # R-STYLE-3, R-ERR-1: library code neither prints, panics nor exits.
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^panic$
        - pattern: ^log\.(Fatal|Panic|Print)(|f|ln)$
        - pattern: ^os\.Exit$
    # R-SIZE-1: at most 50 lines of code a function, comments not counted.
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    # R-SIZE-5: cognitive and cyclomatic complexity at most 15, nesting at most 5.
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 15
    nestif:
      min-complexity: 5
    # R-GO-4: a switch on an enum names every value; a default does not stand for them.
    exhaustive:
      default-signifies-exhaustive: false
    # R-DOC-5: no TODO or FIXME comments.
    godox:
      keywords: [TODO, FIXME, XXX, BUG, HACK]
    # R-LINT-3: every nolint names its linter and says why.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      enable-default-rules: true
      rules:
        # R-SIZE-3: at most 5 parameters.
        - name: argument-limit
          arguments: [5]
        # R-SIZE-1, as funlen.
        - name: function-length
          arguments: [0, 50]
        # R-SIZE-2: at most 600 lines a file, every line counted.
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: false
              skipBlankLines: false
        # R-SIZE-5: nesting at most 5.
        - name: max-control-nesting
          arguments: [5]
        # R-DOC-1: every exported item documented, in Go's form.
        - name: exported
        - name: package-comments
        # R-ERR-1: no process exits but in main.
        - name: deep-exit
        - name: unused-parameter
        - name: early-return
        - name: use-any
        - name: confusing-naming
    gosec:
      excludes: []
    # The driver's sum types are sealed interfaces, returned as such:
    # Value, DataType, JSONItem and reply; and stream, what a connection
    # reads and writes.
    ireturn:
      allow:
        - error
        - stdlib
        - empty
        - generic
        - github.com/turborel/turborel-go\.(Value|DataType|JSONItem|XMLNode|reply|stream)
    errcheck:
      check-type-assertions: true
      check-blank: false

  exclusions:
    generated: strict
    presets: []
    rules:
      # xtask is a tool that runs the go command, prints its steps and
      # exits with their status (RULES.md D12, R-PROC-5): that is its work.
      - path: internal/xtask/
        linters: [forbidigo]
      - path: internal/xtask/
        text: "G204"
        linters: [gosec]
      # The live tests' server package starts the server program the
      # environment names (RULES.md R-TEST-8).
      - path: internal/testserver/
        text: "G204"
        linters: [gosec]
      # R-CONST-5, R-TEST-4: tests use literal fixtures, as the spec
      # prints its bytes.
      - path: _test\.go
        linters: [goconst]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/turborel/turborel-go
