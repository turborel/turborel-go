name: Conformance
description: The driver departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row not yet done is open work, not a departure.
        The spec is The Native Protocol (doc/client/05-protocol.md in turborel); where it and turborel-client differ, turborel-client is right.
  - type: dropdown
    id: reference
    attributes:
      label: Departs from
      options:
        - The Native Protocol (the spec)
        - turborel-client (the reference client)
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: The section
      description: The spec's heading, e.g. "Composite fields", or the turborel-client feature, e.g. "Pipelines".
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the spec's text, or say what turborel-client does, with its file.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest Go program that shows the departure, and the SQL it needs.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the spec or turborel-client requires
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the driver does
      description: Its result or its error, and the bytes on the wire if you have them.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
