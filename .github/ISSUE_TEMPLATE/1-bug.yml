name: Bug
description: The driver fails, crashes, hangs, or reads or sends a wrong value.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        A failure turborel-client shows too is the server's: report it to turborel.
        Put a severe impact first in the title: `[WRONG VALUE]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Wrong value read or sent
        - Crash, panic or hang
        - Wrong error, SQLCODE or SQLSTATE
        - Connection refused or lost
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest Go program that shows it, and the SQL that sets up the database it runs against.
        Say whether it uses database/sql or the native API.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the spec or turborel-client if it says, e.g. `[PROTOCOL Values]`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the error's SQLCODE, SQLSTATE and message, and the panic and its stack if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: "`go version`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The turborel commit or release the server was built from.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Connection settings
      description: The URI or settings used, with the password left out, and how the server was reached (TCP, TLS, a Unix socket or a named pipe).
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How often it happens, what you ruled out.
