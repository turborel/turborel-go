name: Performance
description: The driver is slower than it was, or than it should be, or takes too much memory.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: Numbers, not impressions. Put `[REGRESSION]` first in the title if an earlier commit was faster.
  - type: textarea
    id: summary
    attributes:
      label: What is slow
      description: The workload, and what it costs (time, throughput, memory, allocations), against what you expected and why.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The Go program or benchmark, the schema and how much data, and how many goroutines and connections at once.
      render: go
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measurements
      description: |
        What you measured and how, with several runs.
        If a Go benchmark shows it: `go test -bench NAME -count 10` on the good commit and the bad one, compared by `benchstat`.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it was faster before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The platform, processor, cores and memory, the Go version, the server's commit, and the network between client and server.
    validations:
      required: true
